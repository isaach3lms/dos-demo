<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Discipleship Operating System — Client Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#2563FF;
  --navy:#1E3A8A;
  --ink:#0B1026;
  --mist:#E6EEFF;
  --white:#FFFFFF;
  --line:rgba(11,16,38,.10);
  --line-soft:rgba(11,16,38,.06);
  --muted:rgba(11,16,38,.55);
  --muted-2:rgba(11,16,38,.38);
  --flag:#B45309;
  --flag-bg:#FDF3E3;
  --good:#0F766E;
  --good-bg:#E4F4F1;
  --shadow-sm:0 1px 2px rgba(11,16,38,.06), 0 2px 6px rgba(11,16,38,.05);
  --shadow-md:0 4px 14px rgba(11,16,38,.08), 0 1px 3px rgba(11,16,38,.06);
  --shadow-lg:0 18px 48px rgba(11,16,38,.18);
  --r-sm:8px; --r:14px; --r-lg:20px;
  --accent:#2563FF;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:'Poppins',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
  background:#F5F7FC;color:var(--ink);
  -webkit-font-smoothing:antialiased;
  font-size:14px;line-height:1.5;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:4px}
.mono{font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace}
.eyebrow{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:var(--muted-2)}

/* ---------- Demo chrome ---------- */
.demobar{
  position:sticky;top:0;z-index:60;
  display:flex;align-items:center;gap:18px;flex-wrap:wrap;
  padding:10px 20px;background:var(--ink);color:#fff;
}
.demobar .brandmark{display:flex;align-items:center;gap:9px;font-weight:600;font-size:13px;letter-spacing:.01em}
.brandmark .dot{width:9px;height:9px;border-radius:50%;background:var(--blue);box-shadow:0 0 0 4px rgba(37,99,255,.25)}
.demobar .tag{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.45);font-weight:600}
.demobar .spacer{flex:1}
.seg{display:flex;background:rgba(255,255,255,.09);border-radius:999px;padding:3px}
.seg button{padding:6px 14px;border-radius:999px;font-size:12.5px;font-weight:500;color:rgba(255,255,255,.68)}
.seg button[aria-selected="true"]{background:#fff;color:var(--ink);font-weight:600}
.picker{display:flex;align-items:center;gap:8px;font-size:12.5px;color:rgba(255,255,255,.6)}
.picker select{
  font-family:inherit;font-size:12.5px;font-weight:500;color:#fff;
  background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.14);
  border-radius:8px;padding:6px 10px;appearance:none;cursor:pointer;
}
.picker select option{color:#111;background:#fff}
.ghostbtn{font-size:12.5px;font-weight:500;color:rgba(255,255,255,.75);border:1px solid rgba(255,255,255,.18);padding:6px 12px;border-radius:8px}
.ghostbtn:hover{background:rgba(255,255,255,.08);color:#fff}

/* ---------- App shell ---------- */
.shell{display:flex;min-height:calc(100vh - 52px)}
.sidebar{
  width:236px;flex:none;background:var(--ink);color:#fff;
  padding:22px 14px;display:flex;flex-direction:column;gap:4px;
}
.church{display:flex;align-items:center;gap:11px;padding:0 8px 20px}
.church .crest{
  width:38px;height:38px;border-radius:11px;flex:none;
  display:grid;place-items:center;font-weight:700;font-size:14px;color:#fff;
  background:var(--accent);
}
.church.islogo{display:block;padding:2px 8px 20px}
.church .logotile{color:#fff;margin-bottom:9px}
.church .logotile svg.mark{width:142px;height:auto;display:block}
.church.islogo .s{font-size:11.5px;color:rgba(255,255,255,.42)}
.church .n{font-weight:600;font-size:13.5px;line-height:1.25}
.church .s{font-size:11px;color:rgba(255,255,255,.42)}
.navlbl{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.32);font-weight:600;padding:14px 10px 6px}
.nav{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:10px;font-size:13.5px;color:rgba(255,255,255,.66);width:100%;text-align:left;font-weight:400}
.nav:hover{background:rgba(255,255,255,.06);color:#fff}
.nav[aria-current="true"]{background:rgba(255,255,255,.10);color:#fff;font-weight:600}
.nav .ic{width:17px;height:17px;flex:none;opacity:.9}
.nav .cnt{margin-left:auto;font-size:11px;font-weight:600;background:var(--accent);color:#fff;padding:1px 7px;border-radius:999px}
.sidefoot{margin-top:auto;padding:14px 10px 0;border-top:1px solid rgba(255,255,255,.09);font-size:11.5px;color:rgba(255,255,255,.4)}

.main{flex:1;min-width:0;background:#F5F7FC}
.topline{
  display:flex;align-items:center;gap:16px;padding:20px 30px 0;
}
.topline h1{font-size:23px;font-weight:600;letter-spacing:-.02em;margin:0}
.topline .sub{font-size:13px;color:var(--muted);margin-top:2px}
.topline .spacer{flex:1}
.btn{background:var(--accent);color:#fff;font-size:13px;font-weight:500;padding:9px 15px;border-radius:10px;box-shadow:var(--shadow-sm)}
.btn:hover{filter:brightness(1.06)}
.btn.sec{background:#fff;color:var(--ink);border:1px solid var(--line)}
.content{padding:22px 30px 46px;display:grid;gap:18px}

/* ---------- Cards ---------- */
.card{background:#fff;border:1px solid var(--line-soft);border-radius:var(--r);box-shadow:var(--shadow-sm)}
.card .hd{display:flex;align-items:center;gap:12px;padding:16px 18px 0}
.card .hd h2{font-size:14.5px;font-weight:600;margin:0;letter-spacing:-.01em}
.card .hd .spacer{flex:1}
.card .bd{padding:16px 18px 18px}
.link{font-size:12.5px;color:var(--blue);font-weight:500}

/* ---------- Journey rail (signature) ---------- */
.rail{background:#fff;border:1px solid var(--line-soft);border-radius:var(--r-lg);box-shadow:var(--shadow-md);overflow:hidden}
.rail .rhead{display:flex;align-items:flex-end;gap:14px;padding:20px 22px 14px}
.rail .rhead h2{margin:0;font-size:16px;font-weight:600;letter-spacing:-.01em}
.rail .rhead p{margin:3px 0 0;font-size:12.5px;color:var(--muted)}
.rail .rhead .spacer{flex:1}
.stages{display:grid;grid-template-columns:repeat(7,1fr);border-top:1px solid var(--line-soft)}
.stage{
  position:relative;padding:16px 14px 18px;text-align:left;
  border-right:1px solid var(--line-soft);background:#fff;transition:background .18s ease;
}
.stage:last-child{border-right:none}
.stage:hover{background:#FAFBFF}
.stage[aria-pressed="true"]{background:var(--mist)}
.stage .nm{font-size:11.5px;font-weight:600;color:var(--muted);letter-spacing:.02em}
.stage .num{font-size:27px;font-weight:600;letter-spacing:-.03em;line-height:1.1;margin-top:5px;font-family:'IBM Plex Mono',monospace}
.stage .bar{height:4px;border-radius:999px;background:var(--mist);margin-top:9px;overflow:hidden}
.stage .bar i{display:block;height:100%;border-radius:999px;background:var(--accent)}
.stage .meta{margin-top:9px;font-size:11px;color:var(--muted-2);display:flex;align-items:center;gap:5px;min-height:17px}
.stage .stuck{color:var(--flag);background:var(--flag-bg);border-radius:999px;padding:1px 7px;font-weight:600;font-size:10.5px}
.stage .arrow{position:absolute;right:-6px;top:50%;width:11px;height:11px;border-top:1px solid var(--line);border-right:1px solid var(--line);transform:translateY(-50%) rotate(45deg);background:#fff;z-index:2}
.stage:last-child .arrow{display:none}
.railfoot{display:flex;gap:22px;align-items:center;padding:12px 22px;background:#FAFBFF;border-top:1px solid var(--line-soft);font-size:12px;color:var(--muted)}
.railfoot b{color:var(--ink);font-weight:600}

/* ---------- Metrics ---------- */
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.metric{background:#fff;border:1px solid var(--line-soft);border-radius:var(--r);padding:15px 16px;box-shadow:var(--shadow-sm)}
.metric .k{font-size:11px;color:var(--muted);font-weight:500}
.metric .v{font-size:25px;font-weight:600;letter-spacing:-.03em;margin-top:6px;font-family:'IBM Plex Mono',monospace}
.metric .d{font-size:11.5px;margin-top:4px;color:var(--good);font-weight:500}
.metric .d.down{color:var(--flag)}
.spark{display:flex;align-items:flex-end;gap:3px;height:26px;margin-top:10px}
.spark i{flex:1;background:var(--mist);border-radius:2px}
.spark i.on{background:var(--accent)}

.grid-2{display:grid;grid-template-columns:1.25fr .9fr;gap:18px;align-items:start}

/* ---------- Lists ---------- */
.row{display:flex;align-items:center;gap:12px;padding:11px 18px;border-top:1px solid var(--line-soft);width:100%;text-align:left}
.row:hover{background:#FAFBFF}
.row:first-of-type{border-top:none}
.av{width:34px;height:34px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:12px;font-weight:600;color:var(--navy);background:var(--mist)}
.av.solid{background:var(--accent);color:#fff}
.rn{font-size:13.5px;font-weight:500;display:block}
.rs{font-size:11.5px;color:var(--muted);margin-top:1px;display:block}
.row .spacer{flex:1}
.pill{font-size:10.5px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--mist);color:var(--navy);white-space:nowrap}
.pill.warn{background:var(--flag-bg);color:var(--flag)}
.pill.good{background:var(--good-bg);color:var(--good)}
.pill.ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}
.mini{font-size:12px;font-weight:500;color:var(--blue);padding:5px 10px;border-radius:8px;border:1px solid var(--line)}
.mini:hover{background:var(--mist)}

.tablehd{display:flex;gap:12px;padding:10px 18px;background:#FAFBFF;border-top:1px solid var(--line-soft);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted-2);font-weight:600}

.filters{display:flex;gap:8px;flex-wrap:wrap;padding:14px 18px 4px}
.chip{font-size:12px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);color:var(--muted);font-weight:500}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.search{flex:1;min-width:180px;border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-family:inherit;font-size:12.5px;color:var(--ink)}
.search::placeholder{color:var(--muted-2)}

/* ---------- Person drawer ---------- */
.scrim{position:fixed;inset:0;background:rgba(11,16,38,.42);opacity:0;pointer-events:none;transition:opacity .22s ease;z-index:70}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{
  position:fixed;top:0;right:0;height:100%;width:430px;max-width:94vw;background:#fff;z-index:80;
  transform:translateX(100%);transition:transform .26s cubic-bezier(.22,1,.36,1);
  box-shadow:var(--shadow-lg);display:flex;flex-direction:column;
}
.drawer.on{transform:translateX(0)}
.dhead{padding:22px 22px 16px;background:var(--ink);color:#fff}
.dhead .top{display:flex;align-items:center;gap:14px}
.dhead .av{width:48px;height:48px;font-size:16px;background:var(--accent);color:#fff}
.dhead h3{margin:0;font-size:18px;font-weight:600;letter-spacing:-.01em}
.dhead .s{font-size:12px;color:rgba(255,255,255,.55);margin-top:2px}
.dhead .x{margin-left:auto;color:rgba(255,255,255,.6);font-size:20px;line-height:1;padding:4px 8px;border-radius:8px}
.dhead .x:hover{background:rgba(255,255,255,.1);color:#fff}
.journeymini{display:flex;gap:4px;margin-top:18px}
.journeymini i{flex:1;height:5px;border-radius:999px;background:rgba(255,255,255,.16)}
.journeymini i.on{background:var(--accent)}
.journeymini i.now{background:#fff}
.dbody{flex:1;overflow-y:auto;padding:0 0 26px}
.dsec{padding:18px 22px;border-bottom:1px solid var(--line-soft)}
.dsec h4{margin:0 0 12px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted-2);font-weight:600}
.kv{display:flex;justify-content:space-between;gap:14px;padding:6px 0;font-size:13px;border-bottom:1px dashed var(--line-soft)}
.kv:last-child{border-bottom:none}
.kv span{color:var(--muted)}
.kv b{font-weight:500}
.alert{display:flex;gap:11px;background:var(--flag-bg);border:1px solid rgba(180,83,9,.16);border-radius:var(--r);padding:13px 14px}
.alert .t{font-size:12.5px;font-weight:600;color:var(--flag)}
.alert .d{font-size:12px;color:rgba(180,83,9,.9);margin-top:3px;line-height:1.45}
.tl{position:relative;padding-left:20px}
.tl:before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:1px;background:var(--line)}
.tli{position:relative;padding:0 0 15px}
.tli:before{content:"";position:absolute;left:-19px;top:5px;width:9px;height:9px;border-radius:50%;background:var(--mist);border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}
.tli.hi:before{background:var(--accent)}
.tli .w{font-size:13px;font-weight:500}
.tli .d{font-size:11.5px;color:var(--muted);margin-top:1px}
.dfoot{padding:14px 22px;border-top:1px solid var(--line);display:flex;gap:9px;background:#FAFBFF}

/* ---------- Phone (member) ---------- */
.memberwrap{display:grid;grid-template-columns:390px 1fr;gap:36px;padding:30px;align-items:start}
.phone{
  width:390px;height:800px;background:var(--ink);border-radius:46px;padding:11px;
  box-shadow:var(--shadow-lg);position:sticky;top:76px;
}
.screen{width:100%;height:100%;background:#fff;border-radius:36px;overflow:hidden;display:flex;flex-direction:column;position:relative}
.status{display:flex;justify-content:space-between;padding:13px 24px 4px;font-size:11.5px;font-weight:600}
.mhead{padding:8px 22px 16px}
.mhead .hi{font-size:21px;font-weight:600;letter-spacing:-.02em}
.mhead .sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.mbody{flex:1;overflow-y:auto;padding:0 18px 20px;display:grid;gap:13px;align-content:start}
.mcard{border:1px solid var(--line-soft);border-radius:var(--r);padding:15px;box-shadow:var(--shadow-sm);background:#fff}
.mcard.dark{background:var(--ink);color:#fff;border-color:transparent}
.mcard.dark .lbl{color:rgba(255,255,255,.5)}
.mcard.tint{background:var(--mist);border-color:transparent}
.lbl{font-size:10px;letter-spacing:.13em;text-transform:uppercase;font-weight:600;color:var(--muted-2)}
.verse{font-size:15.5px;line-height:1.5;margin-top:9px;font-weight:500}
.vref{font-size:12px;margin-top:8px;color:var(--accent);font-weight:600}
.mcard .t{font-size:14.5px;font-weight:600;margin-top:7px}
.mcard .d{font-size:12.5px;color:var(--muted);margin-top:4px;line-height:1.45}
.prog{height:6px;border-radius:999px;background:var(--mist);margin-top:11px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);border-radius:999px}
.mcard.dark .prog{background:rgba(255,255,255,.14)}
.mbtn{width:100%;background:var(--accent);color:#fff;font-size:13.5px;font-weight:500;padding:11px;border-radius:11px;margin-top:12px}
.mbtn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.streak{display:flex;gap:6px;margin-top:11px}
.streak i{flex:1;height:30px;border-radius:7px;background:var(--mist);display:grid;place-items:center;font-size:9.5px;font-weight:600;color:var(--muted-2)}
.streak i.on{background:var(--accent);color:#fff}
.tabbar{display:flex;border-top:1px solid var(--line-soft);padding:9px 6px 20px;background:#fff}
.tab{flex:1;display:grid;gap:4px;justify-items:center;font-size:10px;font-weight:500;color:var(--muted-2);padding:5px 0}
.tab .ic{width:20px;height:20px}
.tab[aria-current="true"]{color:var(--accent);font-weight:600}
.amounts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.amt{border:1px solid var(--line);border-radius:11px;padding:11px 0;font-size:14px;font-weight:600;text-align:center;font-family:'IBM Plex Mono',monospace}
.amt[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}

/* ---------- Talk track panel ---------- */
.track{position:sticky;top:76px;display:grid;gap:14px}
.track .card .bd{font-size:13px;color:var(--muted);line-height:1.55}
.beat{display:flex;gap:12px;padding:12px 18px;border-top:1px solid var(--line-soft)}
.beat .n{font-family:'IBM Plex Mono',monospace;font-size:11.5px;font-weight:600;color:var(--accent);padding-top:2px}
.beat .w{font-size:13px;font-weight:500;color:var(--ink)}
.beat .s{font-size:12px;color:var(--muted);margin-top:2px;line-height:1.45}

/* ---------- Settings ---------- */
.swatches{display:flex;gap:10px;margin-top:10px}
.sw{width:38px;height:38px;border-radius:11px;border:2px solid transparent;box-shadow:var(--shadow-sm)}
.sw[aria-pressed="true"]{border-color:var(--ink)}
.toggle{width:40px;height:23px;border-radius:999px;background:var(--line);position:relative;flex:none}
.toggle[aria-pressed="true"]{background:var(--accent)}
.toggle:after{content:"";position:absolute;top:3px;left:3px;width:17px;height:17px;border-radius:50%;background:#fff;transition:left .18s ease;box-shadow:var(--shadow-sm)}
.toggle[aria-pressed="true"]:after{left:20px}

.emptynote{padding:26px 18px;text-align:center;color:var(--muted);font-size:13px}

/* ---------- Service planner ---------- */
.weekstrip{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 6px}
.week{
  flex:none;min-width:150px;text-align:left;background:#fff;border:1px solid var(--line-soft);
  border-radius:var(--r);padding:12px 14px;box-shadow:var(--shadow-sm);
}
.week:hover{border-color:var(--line)}
.week[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px rgba(37,99,255,.16)}
.week .wd{font-size:11px;color:var(--muted-2);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.week .wt{font-size:13.5px;font-weight:600;margin-top:4px;letter-spacing:-.01em;line-height:1.3}
.week .wm{font-size:11.5px;color:var(--muted);margin-top:5px}
.week .wp{margin-top:8px}
.el{display:flex;align-items:center;gap:12px;padding:10px 18px;border-top:1px solid var(--line-soft)}
.el:hover{background:#FAFBFF}
.el .t{width:52px;flex:none;font-size:12px;color:var(--muted)}
.el .body{flex:1;min-width:0}
.el .ti{font-size:13.5px;font-weight:500;display:block}
.el .su{font-size:11.5px;color:var(--muted);margin-top:1px;display:block}
.el .dur{width:56px;text-align:right;font-size:12px;color:var(--muted)}
.acts{display:flex;gap:4px;opacity:0;transition:opacity .15s ease}
.el:hover .acts,.el:focus-within .acts{opacity:1}
.iconbtn{width:26px;height:26px;border-radius:7px;border:1px solid var(--line);display:grid;place-items:center;font-size:12px;color:var(--muted);line-height:1}
.iconbtn:hover{background:var(--mist);color:var(--ink);border-color:var(--accent)}
.iconbtn.danger:hover{background:var(--flag-bg);color:var(--flag);border-color:rgba(180,83,9,.3)}
.addel{display:flex;gap:9px;padding:13px 18px;border-top:1px dashed var(--line);background:#FAFBFF;flex-wrap:wrap;align-items:center}
.addel .mini{white-space:nowrap}
.song{display:flex;align-items:center;gap:12px;padding:12px 18px;border-top:1px solid var(--line-soft);flex-wrap:wrap}
.song .sb{flex:1;min-width:190px}
.song .st{font-size:13.5px;font-weight:500;display:block}
.song .sa{font-size:11.5px;color:var(--muted);margin-top:1px;display:block}
.keysel{font-family:inherit;font-size:12px;font-weight:600;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:5px 8px;background:#fff}
.chartlinks{display:flex;gap:6px;flex-wrap:wrap}
.chartbtn{font-size:11.5px;font-weight:500;color:var(--navy);background:var(--mist);border-radius:8px;padding:6px 10px;display:flex;align-items:center;gap:5px}
.chartbtn:hover{background:var(--accent);color:#fff}
.conn{display:flex;align-items:center;gap:13px;padding:14px 18px;background:#FAFBFF;border-top:1px solid var(--line-soft)}
.conn .logo{width:38px;height:38px;border-radius:10px;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:11px;font-weight:700;letter-spacing:.02em;flex:none}
.toast{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:95;
  background:var(--ink);color:#fff;font-size:13px;padding:11px 18px;border-radius:999px;box-shadow:var(--shadow-lg);
}

/* ---------- Resources ---------- */
.resgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.rescard{background:#fff;border:1px solid var(--line-soft);border-radius:var(--r);box-shadow:var(--shadow-sm);overflow:hidden;text-align:left;display:flex;flex-direction:column}
.rescard:hover{box-shadow:var(--shadow-md);border-color:var(--line)}
.thumb{aspect-ratio:16/9;display:grid;place-items:center;position:relative;overflow:hidden}
.thumb .glyph{width:44px;height:44px;opacity:.95}
.thumb .badge{position:absolute;top:9px;right:9px;font-size:10px;font-weight:600;padding:3px 8px;border-radius:999px;background:rgba(255,255,255,.92);color:var(--ink)}
.thumb.lite .glyph{color:var(--navy)}
.rescard .rbody{padding:13px 15px 15px;flex:1;display:flex;flex-direction:column}
.rescard .rt{font-size:14px;font-weight:600;letter-spacing:-.01em;line-height:1.3}
.rescard .rd{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.45;flex:1}
.rescard .rf{display:flex;align-items:center;gap:8px;margin-top:11px}
.rescard .rf .m{font-size:11.5px;color:var(--muted-2);margin-left:auto}
.thumbpick{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.thumbpick button{aspect-ratio:1;border-radius:11px;border:2px solid transparent}
.thumbpick button[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 2px #fff inset}
.sess{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px dashed var(--line-soft)}
.sess .num{width:22px;flex:none;font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted-2);font-weight:600}
.sess input{font-family:inherit;font-size:13px;border:1px solid var(--line);border-radius:8px;padding:7px 9px;color:var(--ink)}
.sess .st{flex:1;min-width:0}
.sess .sr{width:118px;flex:none}
.sess .acts{display:flex;gap:4px;flex:none}
.bigthumb{aspect-ratio:5/1;max-height:118px;border-radius:14px;display:grid;place-items:center;margin-bottom:4px}
.bigthumb .glyph{width:42px;height:42px}

/* ---------- Giving reports ---------- */
.rpt{display:grid;gap:16px}
.rptnums{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.rptnums div{background:var(--mist);border-radius:12px;padding:11px 12px}
.rptnums .k{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--navy);opacity:.7;font-weight:600}
.rptnums .v{font-size:18px;font-weight:600;margin-top:3px;font-family:'IBM Plex Mono',monospace;letter-spacing:-.02em}
.bars{display:flex;align-items:flex-end;gap:7px;height:112px;padding-top:6px}
.bars .col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px;height:100%}
.bars .bar2{width:100%;background:var(--accent);border-radius:5px 5px 0 0;min-height:3px}
.bars .bl{font-size:9.5px;color:var(--muted-2);font-weight:500;white-space:nowrap}
.brk{display:grid;gap:8px}
.brk .r{display:grid;grid-template-columns:1fr auto;gap:10px;font-size:12.5px;align-items:center}
.brk .track{grid-column:1/-1;height:5px;border-radius:999px;background:var(--mist);overflow:hidden}
.brk .track i{display:block;height:100%;background:var(--accent);border-radius:999px}
.periodpick{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.periodpick button{border:2px solid var(--line);border-radius:13px;padding:14px 10px;text-align:left}
.periodpick button:hover{border-color:var(--accent)}
.periodpick button[aria-pressed="true"]{border-color:var(--accent);background:var(--mist)}
.periodpick .pt{font-size:13.5px;font-weight:600}
.periodpick .ps{font-size:11px;color:var(--muted);margin-top:2px;line-height:1.35}

/* ---------- Check in kiosk ---------- */
.kiosk{position:fixed;inset:0;z-index:100;background:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:26px;overflow-y:auto}
.kiosk .exit{position:absolute;top:18px;right:20px;font-size:12.5px;color:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.18);padding:7px 13px;border-radius:9px}
.kiosk .exit:hover{background:rgba(255,255,255,.09);color:#fff}
.kiosk .brand{position:absolute;top:18px;left:22px;color:#fff;opacity:.85}
.kiosk .brand svg.mark{width:112px;height:auto;display:block}
.kcard{width:100%;max-width:600px;background:#fff;border-radius:24px;box-shadow:var(--shadow-lg);overflow:hidden}
.kcard .kh{padding:26px 30px 8px;text-align:center}
.kcard .kh h2{margin:0;font-size:25px;font-weight:600;letter-spacing:-.02em}
.kcard .kh p{margin:7px 0 0;font-size:14px;color:var(--muted);line-height:1.5}
.kcard .kb{padding:22px 30px 30px}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;max-width:330px;margin:0 auto}
.pad button{height:62px;border-radius:15px;background:var(--mist);font-size:24px;font-weight:600;color:var(--navy);font-family:'IBM Plex Mono',monospace}
.pad button:hover{background:var(--accent);color:#fff}
.pad button.util{font-size:14px;font-family:inherit;background:#fff;border:1px solid var(--line);color:var(--muted)}
.pad button.util:hover{background:var(--ink);color:#fff;border-color:var(--ink)}
.digits{display:flex;gap:12px;justify-content:center;margin:6px 0 22px}
.digits i{width:52px;height:62px;border-radius:14px;border:2px solid var(--line);display:grid;place-items:center;font-size:26px;font-weight:600;font-family:'IBM Plex Mono',monospace;color:var(--ink)}
.digits i.on{border-color:var(--accent);background:var(--mist)}
.kidcard{display:flex;align-items:center;gap:15px;width:100%;text-align:left;padding:17px 18px;border:2px solid var(--line);border-radius:16px;margin-bottom:11px;background:#fff}
.kidcard:hover{border-color:var(--accent)}
.kidcard[aria-pressed="true"]{border-color:var(--accent);background:var(--mist)}
.kidcard .kav{width:48px;height:48px;border-radius:14px;background:var(--mist);color:var(--navy);display:grid;place-items:center;font-size:16px;font-weight:600;flex:none}
.kidcard[aria-pressed="true"] .kav{background:var(--accent);color:#fff}
.kidcard .kn{font-size:16px;font-weight:600}
.kidcard .kr{font-size:12.5px;color:var(--muted);margin-top:2px}
.kidcard .check{margin-left:auto;width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:transparent;font-size:13px;font-weight:700;flex:none}
.kidcard[aria-pressed="true"] .check{background:var(--accent);border-color:var(--accent);color:#fff}
.kbtn{width:100%;background:var(--accent);color:#fff;font-size:16px;font-weight:600;padding:16px;border-radius:15px;margin-top:8px}
.kbtn:disabled{opacity:.35;cursor:not-allowed}
.kbtn.ghost{background:#fff;border:1px solid var(--line);color:var(--ink);font-weight:500;font-size:14px;padding:12px;margin-top:10px}
.label{border:2px dashed var(--line);border-radius:16px;padding:18px;margin-bottom:12px}
.label .lt{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.label .ln{font-size:19px;font-weight:600}
.label .lc{font-family:'IBM Plex Mono',monospace;font-size:23px;font-weight:600;color:var(--accent);letter-spacing:.06em}
.label .lr{font-size:12.5px;color:var(--muted);margin-top:4px}
.label .la{margin-top:10px;display:inline-block}
.kdone{text-align:center;padding:14px 0 4px}
.kdone .tick{width:62px;height:62px;border-radius:50%;background:var(--good-bg);color:var(--good);display:grid;place-items:center;margin:0 auto 16px;font-size:29px;font-weight:600}

/* ---------- Support modal ---------- */
.modalwrap{position:fixed;inset:0;z-index:90;display:grid;place-items:center;padding:24px}
.modalwrap .mscrim{position:absolute;inset:0;background:rgba(11,16,38,.5)}
.modal{position:relative;width:100%;max-width:470px;background:#fff;border-radius:var(--r-lg);box-shadow:var(--shadow-lg);overflow:hidden;max-height:88vh;display:flex;flex-direction:column}
.modal .mh{padding:20px 22px 16px;background:var(--ink);color:#fff;display:flex;align-items:flex-start;gap:12px}
.modal .mh h3{margin:0;font-size:17px;font-weight:600;letter-spacing:-.01em}
.modal .mh .s{font-size:12px;color:rgba(255,255,255,.55);margin-top:3px;line-height:1.45}
.modal .mh .x{margin-left:auto;color:rgba(255,255,255,.6);font-size:20px;line-height:1;padding:2px 8px;border-radius:8px}
.modal .mh .x:hover{background:rgba(255,255,255,.1);color:#fff}
.modal .mb{padding:20px 22px;overflow-y:auto;display:grid;gap:14px}
.field{display:grid;gap:6px}
.field label{font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;color:var(--muted-2)}
.field input,.field textarea,.field select{
  font-family:inherit;font-size:13.5px;color:var(--ink);background:#fff;
  border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;
}
.field textarea{min-height:96px;resize:vertical;line-height:1.5}
.field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,255,.14)}
.field .err{font-size:11.5px;color:var(--flag);display:none}
.field.bad input,.field.bad textarea{border-color:var(--flag)}
.field.bad .err{display:block}
.modal .mf{padding:14px 22px;border-top:1px solid var(--line);background:#FAFBFF;display:flex;gap:9px;align-items:center}
.modal .mf .note{font-size:11px;color:var(--muted-2);flex:1;min-width:0;line-height:1.4;word-break:break-word}
.modal .mf .btn{white-space:nowrap}
.sent{padding:34px 26px;text-align:center}
.sent .tick{width:46px;height:46px;border-radius:50%;background:var(--good-bg);color:var(--good);display:grid;place-items:center;margin:0 auto 14px;font-size:22px;font-weight:600}
.sent h3{margin:0;font-size:17px;font-weight:600}
.sent p{margin:8px 0 0;font-size:13px;color:var(--muted);line-height:1.55}

@media (max-width:1180px){
  .metrics{grid-template-columns:repeat(2,1fr)}
  .grid-2{grid-template-columns:1fr}
  .memberwrap{grid-template-columns:1fr;justify-items:center}
  .phone{position:static}
  .track{position:static;width:100%;max-width:560px}
}
@media (max-width:900px){
  .sidebar{display:none}
  .stages{grid-template-columns:repeat(4,1fr)}
  .stage .arrow{display:none}
}
@media (max-width:620px){
  .stages{grid-template-columns:repeat(2,1fr)}
  .metrics{grid-template-columns:1fr}
  .content,.topline{padding-left:16px;padding-right:16px}
  .phone{width:100%;max-width:390px;height:740px}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none !important;animation:none !important}
}

function manualTotal(){ return MANUAL_GIFTS.reduce((t,g)=>t+g.amount,0); }

function buildReport(period){
  const cfg = {
    weekly:{buckets:GIVING_WEEKS, title:"Weekly giving", range:"July 12 through August 2, 2026", givers:214, newG:5},
    monthly:{buckets:GIVING_MONTHS, title:"Monthly giving", range:"March through August 2026", givers:286, newG:19},
    ytd:{buckets:GIVING_YTD, title:"Year to date giving", range:"January 1 through August 5, 2026", givers:341, newG:47}
  }[period];
  const base = cfg.buckets.reduce((t,b)=>t+b.a,0);
  const total = base + manualTotal();
  const online = Math.round(base*.86);
  const cash = MANUAL_GIFTS.filter(g=>g.method==="Cash").reduce((t,g)=>t+g.amount, Math.round(base*.06));
  const check = MANUAL_GIFTS.filter(g=>g.method!=="Cash").reduce((t,g)=>t+g.amount, Math.round(base*.08));
  return {
    period, title:cfg.title, range:cfg.range, total, givers:cfg.givers, newG:cfg.newG,
    avg: Math.round(total/cfg.givers),
    buckets: cfg.buckets,
    funds: FUND_SPLIT.map(([n,pct])=>[n, Math.round(total*pct), pct]),
    methods: [["Online recurring", Math.round(online*.72)],["Online one time", Math.round(online*.28)],["Check", check],["Cash", cash]]
  };
}

function timesFor(sv){
  const [h,m] = sv.start.split(":").map(Number);
  let t = h*60+m; const out=[];
  sv.elements.forEach(el=>{ out.push(t); t += Number(el.mins)||0; });
  out.push(t);
  return out.map(mins=>{
    let hh = Math.floor(mins/60), mm = mins%60;
    const suffix = hh>=12 ? "pm" : "am";
    let disp = hh%12; if(disp===0) disp=12;
    return `${disp}:${String(mm).padStart(2,"0")}`;
  });
}

function resSync(){
  const d = S.resDraft; if(!d) return;
  const g = id => document.getElementById(id);
  if(g("res-title")) d.title = g("res-title").value;
  if(g("res-desc")) d.desc = g("res-desc").value;
  if(g("res-type")) d.type = g("res-type").value;
  if(g("res-status")) d.status = g("res-status").value;
  document.querySelectorAll("[data-sess]").forEach(row=>{
    const i = Number(row.dataset.sess);
    d.sessions[i] = {
      t: row.querySelector(".st").value,
      r: row.querySelector(".sr").value,
      m: Number(row.querySelector(".sm").value)||10
    };
  });
}

function saveResource(){
  resSync();
  const d = S.resDraft;
  if(!d.title.trim()){ document.getElementById("f-restitle").classList.add("bad"); return; }
  if(S.resEdit==="new"){
    RESOURCES.push({...d, id:"r"+Date.now(), started:0});
    toast(`${d.title} created${d.status==="Published"?" and published":" as a draft"}.`);
  } else {
    const i = RESOURCES.findIndex(r=>r.id===S.resEdit);
    RESOURCES[i] = {...RESOURCES[i], ...d};
    toast(`${d.title} updated. Members see it now.`);
  }
  S.resEdit=null; S.resDraft=null; render();
}

function exportReport(){
  const r = S.report; if(!r) return;
  const rows = [["Report", r.title],["Range", r.range],["Church", CHURCHES[S.church].name],[],
    ["Total", r.total],["Givers", r.givers],["Average gift", r.avg],["New givers", r.newG],[],
    ["Period","Amount"], ...r.buckets.map(b=>[b.l,b.a]), [],
    ["Fund","Amount"], ...r.funds.map(f=>[f[0],f[1]]), [],
    ["Method","Amount"], ...r.methods.map(m=>[m[0],m[1]])];
  const csv = rows.map(row=>row.map(c=>`"${String(c??"").replace(/"/g,'""')}"`).join(",")).join("\n");
  const url = URL.createObjectURL(new Blob([csv],{type:"text/csv"}));
  const a = document.createElement("a");
  a.href=url; a.download=`giving-${r.period}-2026.csv`; a.click();
  URL.revokeObjectURL(url);
  toast("CSV downloaded. Send it straight to your bookkeeper.");
  render();
}

  render();
}

    return `<div class="modalwrap"><div class="mscrim" data-close-support></div>
      <div class="modal" role="dialog" aria-modal="true" aria-label="Request sent">
        <div class="sent">
          <div class="tick">&#10003;</div>
          <h3>Request sent</h3>
          <p>${SUPPORT.to} has your request. Expect a reply within one business day.</p>
          <button class="btn" style="margin-top:18px" data-close-support>Close</button>
        </div>
      </div></div>`;
  }
  return `<div class="modalwrap"><div class="mscrim" data-close-support></div>
    <div class="modal" role="dialog" aria-modal="true" aria-label="Request support">
      <div class="mh">
        <div><h3>Request support</h3><div class="s">Send this to your support team. Someone replies within one business day.</div></div>
        <button class="x" data-close-support aria-label="Close">&times;</button>
      </div>
      <div class="mb">
        <div class="field" id="f-name"><label for="sup-name">Your name</label><input id="sup-name" autocomplete="name"><span class="err">Add your name.</span></div>
        <div class="field"><label for="sup-org">Church or organization</label><input id="sup-org" value="${c.name}"></div>
        <div class="field" id="f-email"><label for="sup-email">Email for the reply</label><input id="sup-email" type="email" autocomplete="email"><span class="err">Add an email we can reply to.</span></div>
        <div class="field"><label for="sup-urgency">How urgent</label>
          <select id="sup-urgency">
            <option>Question, no rush</option>
            <option>Needed this week</option>
            <option>Blocking us right now</option>
          </select>
        </div>
        <div class="field" id="f-msg"><label for="sup-msg">What do you need</label><textarea id="sup-msg" placeholder="Describe what is happening and what you expected."></textarea><span class="err">Tell us what you need.</span></div>
      </div>
      <div class="mf">
        <span class="note">Goes to ${SUPPORT.to}</span>
        <button class="btn sec" data-close-support>Cancel</button>
        <button class="btn" data-send-support>Send request</button>
      </div>
    </div></div>`;
}

function sendSupport(){
  const val = id => (document.getElementById(id)?.value || "").trim();
  const name=val("sup-name"), org=val("sup-org"), email=val("sup-email"), urg=val("sup-urgency"), msg=val("sup-msg");
  let ok = true;
  const mark = (wrap, bad) => { const el=document.getElementById(wrap); if(el) el.classList.toggle("bad", bad); if(bad) ok=false; };
  mark("f-name", !name);
  mark("f-email", !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email));
  mark("f-msg", !msg);
  if(!ok) return;

  const subject = `Support request: ${org || "Discipleship Operating System"}`;
  const body = `Name: ${name}\nChurch or organization: ${org}\nReply to: ${email}\nUrgency: ${urg}\n\n${msg}`;

  const done = () => { S.supportSent = true; render(); };

  if(SUPPORT.endpoint){
    fetch(SUPPORT.endpoint, {
      method:"POST",
      headers:{"Content-Type":"application/json", "Accept":"application/json"},
      body: JSON.stringify({to:SUPPORT.to, name, organization:org, email, urgency:urg, message:msg, subject})
    }).then(done).catch(()=>{
      window.location.href = `mailto:${SUPPORT.to}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
      done();
    });
  } else {
    window.location.href = `mailto:${SUPPORT.to}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
    done();
  }
}

/* ============================ DRAWER ============================ */
function openPerson(id){
  const p = PEOPLE.find(x=>x.id===id); if(!p) return;
  $("drawer").innerHTML = `
    <div class="dhead">
      <div class="top">
        <span class="av">${initials(p.n)}</span>
        <div><h3>${p.n}</h3><div class="s">${STAGES[p.stage]} since ${p.since} · ${p.days} days</div></div>
        <button class="x" data-close aria-label="Close">×</button>
      </div>
      <div class="journeymini">${STAGES.map((s,i)=>`<i class="${i<p.stage?"on":i===p.stage?"now":""}"></i>`).join("")}</div>
    </div>
    <div class="dbody">
      ${p.flag?`<div class="dsec"><div class="alert"><div><div class="t">Stuck in ${STAGES[p.stage]}</div><div class="d">${p.flag}</div></div></div></div>`:""}
      <div class="dsec">
        <h4>The recommended next step</h4>
        <div style="font-size:14px;font-weight:500">${p.next}</div>
        <div style="display:flex;gap:8px;margin-top:12px">
          <button class="mini" style="border-color:var(--accent);color:var(--accent)">Assign to a person</button>
          <button class="mini">Send it now</button>
        </div>
      </div>
      <div class="dsec">
        <h4>Snapshot</h4>
        <div class="kv"><span>Family</span><b>${p.family}</b></div>
        <div class="kv"><span>Giving</span><b>${p.give}</b></div>
        <div class="kv"><span>Serving</span><b>${p.serve}</b></div>
        <div class="kv"><span>Group</span><b>${p.group}</b></div>
        <div class="kv"><span>Last contact</span><b>${p.last}</b></div>
      </div>
      <div class="dsec" style="border-bottom:none">
        <h4>Timeline</h4>
        <div class="tl">${p.tl.map(t=>`<div class="tli ${t.hi?"hi":""}"><div class="w">${t.w}</div><div class="d">${t.d}</div></div>`).join("")}</div>
      </div>
    </div>
    <div class="dfoot">
      <button class="btn" style="flex:1">Log a conversation</button>
      <button class="btn sec" data-close>Close</button>
    </div>`;
  $("drawer").classList.add("on"); $("scrim").classList.add("on");
  const x = $("drawer").querySelector("[data-close]"); if(x) x.focus();
}
function closeDrawer(){ $("drawer").classList.remove("on"); $("scrim").classList.remove("on"); }

/* ============================ RENDER ============================ */
function render(){
  setAccent();
  app.innerHTML = (S.view==="staff" ? staffView() : memberView()) + talkPanel() + supportModal() + elementModal() + chartModal() + kioskView() + giftModal() + reportPicker() + reportModal() + resourceEditor() + toastEl();
  $("viewStaff").setAttribute("aria-selected", S.view==="staff");
  $("viewMember").setAttribute("aria-selected", S.view==="member");
  const q = $("q"); if(q && S.q){ q.focus(); q.setSelectionRange(q.value.length,q.value.length); }
}

document.addEventListener("click", e=>{
  const t = e.target.closest("[data-tab],[data-stage],[data-person],[data-mtab],[data-close],[data-close-talk],[data-support],[data-close-support],[data-send-support],[data-color],[data-amt],[data-svc],[data-newsvc],[data-editel],[data-delel],[data-move],[data-save-el],[data-close-el],[data-copylast],[data-sendplan],[data-sendset],[data-sendreq],[data-addsong],[data-chart],[data-close-song],[data-res],[data-res-new],[data-res-close],[data-res-save],[data-res-del],[data-thumb],[data-sessadd],[data-sessdel],[data-sessmove],[data-gift-open],[data-close-gift],[data-save-gift],[data-report-open],[data-close-rp],[data-period],[data-run-report],[data-quickreport],[data-close-report],[data-export-report],[data-kiosk-open],[data-kiosk-exit],[data-kiosk-again],[data-kiosk-new],[data-kiosk-go],[data-pin],[data-kid],.toggle");
  if(!t) return;
  if(t.hasAttribute("data-res-new")){ S.resEdit="new"; S.resDraft={title:"",type:"Reading plan",status:"Draft",thumb:0,desc:"",sessions:[{t:"Day 1: ",r:"",m:8}]}; render(); document.getElementById("res-title")?.focus(); return; }
  if(t.dataset.res){ const r=RESOURCES.find(x=>x.id===t.dataset.res); S.resEdit=r.id; S.resDraft=JSON.parse(JSON.stringify(r)); render(); return; }
  if(t.hasAttribute("data-res-close")){ S.resEdit=null; S.resDraft=null; render(); return; }
  if(t.hasAttribute("data-res-save")){ saveResource(); return; }
  if(t.hasAttribute("data-res-del")){ RESOURCES=RESOURCES.filter(x=>x.id!==S.resEdit); S.resEdit=null; S.resDraft=null; toast("Resource deleted."); render(); return; }
  if(t.dataset.thumb!==undefined){ resSync(); S.resDraft.thumb=Number(t.dataset.thumb); render(); return; }
  if(t.hasAttribute("data-sessadd")){ resSync(); S.resDraft.sessions.push({t:"",r:"",m:8}); render(); return; }
  if(t.dataset.sessdel!==undefined){ resSync(); S.resDraft.sessions.splice(Number(t.dataset.sessdel),1); render(); return; }
  if(t.dataset.sessmove!==undefined){
    resSync(); const i=Number(t.dataset.sessmove), j=i+Number(t.dataset.dir), a=S.resDraft.sessions;
    if(j>=0&&j<a.length){ [a[i],a[j]]=[a[j],a[i]]; render(); }
    return;
  }
  if(t.hasAttribute("data-gift-open")){ S.gift=true; S.giftSaved=null; render(); document.getElementById("g-amt")?.focus(); return; }
  if(t.hasAttribute("data-close-gift")){ S.gift=false; S.giftSaved=null; render(); return; }
  if(t.hasAttribute("data-save-gift")){ saveGift(); return; }
  if(t.hasAttribute("data-report-open")){ S.reportPick=true; render(); return; }
  if(t.hasAttribute("data-close-rp")){ S.reportPick=false; render(); return; }
  if(t.dataset.period){ S.reportPeriod=t.dataset.period; render(); return; }
  if(t.hasAttribute("data-run-report")){ S.reportPick=false; S.report=buildReport(S.reportPeriod); render(); return; }
  if(t.dataset.quickreport){ S.reportPeriod=t.dataset.quickreport; S.report=buildReport(t.dataset.quickreport); render(); return; }
  if(t.hasAttribute("data-close-report")){ S.report=null; render(); return; }
  if(t.hasAttribute("data-export-report")){ exportReport(); return; }
  if(t.hasAttribute("data-kiosk-open")){ openKiosk(); return; }
  if(t.hasAttribute("data-kiosk-exit")){ S.kiosk=null; render(); return; }
  if(t.hasAttribute("data-kiosk-again")){ kioskReset(); return; }
  if(t.hasAttribute("data-kiosk-new")){ S.kiosk.step="new"; render(); return; }
  if(t.hasAttribute("data-kiosk-go")){ kioskCheckIn(); return; }
  if(t.dataset.pin){ kioskPin(t.dataset.pin); return; }
  if(t.dataset.kid){
    const k=S.kiosk; const id=t.dataset.kid;
    k.picked = k.picked.includes(id) ? k.picked.filter(x=>x!==id) : k.picked.concat(id);
    render(); return;
  }
  if(t.dataset.svc){ S.service=t.dataset.svc; render(); return; }
  if(t.hasAttribute("data-newsvc")){ addService(); return; }
  if(t.dataset.editel){ S.editEl=t.dataset.editel; render(); document.getElementById("el-title")?.focus(); return; }
  if(t.hasAttribute("data-close-el")){ S.editEl=null; render(); return; }
  if(t.dataset.saveEl){ saveElement(); return; }
  if(t.dataset.delel){ const sv=svc(); sv.elements=sv.elements.filter(x=>String(x.id)!==t.dataset.delel); toast("Element removed."); render(); return; }
  if(t.dataset.move){ moveElement(t.dataset.move, Number(t.dataset.dir)); return; }
  if(t.hasAttribute("data-copylast")){ copyLastPlan(); return; }
  if(t.hasAttribute("data-sendplan")){ toast("Plan sent to 14 team members."); render(); return; }
  if(t.hasAttribute("data-sendset")){ toast("Set sent. Charts open in SongSelect in each person's key."); render(); return; }
  if(t.hasAttribute("data-sendreq")){ toast("Requests sent. Responses land in People."); render(); return; }
  if(t.hasAttribute("data-addsong")){ toast("SongSelect search opens here in the live product."); render(); return; }
  if(t.dataset.chart){ S.songModal=t.dataset.chart; render(); return; }
  if(t.hasAttribute("data-close-song")){ S.songModal=null; render(); return; }
  if(t.hasAttribute("data-support")){ S.support=true; S.supportSent=false; render(); document.getElementById("sup-name")?.focus(); return; }
  if(t.hasAttribute("data-close-support")){ S.support=false; S.supportSent=false; render(); return; }
  if(t.hasAttribute("data-send-support")){ sendSupport(); return; }
  if(t.hasAttribute("data-close")){ closeDrawer(); return; }
  if(t.hasAttribute("data-close-talk")){ S.talk=false; render(); return; }
  if(t.dataset.tab){ S.tab=t.dataset.tab; S.stageFilter=null; render(); return; }
  if(t.dataset.stage!==undefined){
    const v = t.dataset.stage;
    S.stageFilter = (v==="all") ? null : (S.stageFilter===+v ? null : +v);
    if(S.tab!=="people" && v!=="all") S.tab="people";
    render(); return;
  }
  if(t.dataset.person){ openPerson(+t.dataset.person); return; }
  if(t.dataset.mtab){ S.memberTab=t.dataset.mtab; render(); return; }
  if(t.dataset.color){ CHURCHES[S.church].accent=t.dataset.color; render(); return; }
  if(t.dataset.amt){ S.amount=+t.dataset.amt; render(); return; }
  if(t.classList.contains("toggle")){ t.setAttribute("aria-pressed", t.getAttribute("aria-pressed")!=="true"); return; }
});
document.addEventListener("input", e=>{ if(e.target.id==="q"){ S.q=e.target.value; render(); } });
document.addEventListener("change", e=>{
  const k = e.target.closest("[data-key]");
  if(k){ const sg = svc().songs.find(x=>x.id===k.dataset.key); if(sg){ sg.key = k.value; toast(`${sg.title} moved to ${sg.key}. Charts follow the key.`); render(); } }
});
document.addEventListener("keydown", e=>{
  if(e.key==="Escape"){
    closeDrawer();
    if(S.kiosk){S.kiosk=null;render();return;}
    if(S.report){S.report=null;render();return;}
    if(S.reportPick){S.reportPick=false;render();return;}
    if(S.gift){S.gift=false;S.giftSaved=null;render();return;}
    if(S.resEdit){S.resEdit=null;S.resDraft=null;render();return;}
    if(S.editEl){S.editEl=null;render();return;}
    if(S.songModal){S.songModal=null;render();return;}
    if(S.support){S.support=false;S.supportSent=false;render();return;}
    if(S.talk){S.talk=false;render();}
    return;
  }
  if(e.target.tagName==="INPUT"||e.target.tagName==="TEXTAREA") return;
  if(S.kiosk && S.kiosk.step==="pin"){
    if(/^[0-9]$/.test(e.key)){ kioskPin(e.key); return; }
    if(e.key==="Backspace"){ kioskPin("del"); return; }
    return;
  }
  if(e.key==="t"||e.key==="T"){ S.talk=!S.talk; render(); }           // hidden: talk track
  if(e.key==="c"||e.key==="C"){ S.church=(S.church+1)%CHURCHES.length; render(); } // hidden: switch client brand
});
$("scrim").addEventListener("click", closeDrawer);
$("viewStaff").addEventListener("click", ()=>{S.view="staff";render()});
$("viewMember").addEventListener("click", ()=>{S.view="member";render()});

render();
</script>
</body>
</html>
